# Hussh One — LiteLLM Proxy config: transparent Vertex AI (ADC) → OpenAI gateway
#
# Purpose: give VS Code Copilot BYOK *native* capabilities (inline edit, apply,
# agent mode, @workspace, tool calling) backed by Vertex models. Pure passthrough
# of Copilot's tools/tool_choice/streaming/system prompt to Vertex.
#
# Auth to Google: Application Default Credentials (ADC) at
#   ~/.config/gcloud/application_default_credentials.json
# Project: set via __VERTEX_PROJECT__ (filled at install time from your
#   GOOGLE_CLOUD_PROJECT / gcloud active project).
#
# ─────────────────────────────────────────────────────────────────────────────
# RESILIENCE / THROUGHPUT (parallel coding agents):
#   Vertex quota (RESOURCE_EXHAUSTED / 429) is PER-REGION-PER-PROJECT. To survive
#   multiple concurrent agents we register the SAME model_name in every region
#   that actually serves it, so the LiteLLM router load-balances across regions,
#   cools down a region that 429s, and retries on another region. This multiplies
#   effective Gemini QPM by the number of regions.
#
#   Verified gemini-3.5-flash regions (probe 2026-06): global, asia-southeast1,
#   asia-northeast1, asia-south1, europe-west2. us-*/most-eu returned NotFound
#   (model not deployed there) so they are intentionally excluded. If a future
#   model/region changes, re-probe with a tiny completion per region and update.
#
#   Claude (opus/sonnet) is only servable from `global` on Vertex
#   (us-central1 → FAILED_PRECONDITION), so it stays single-region but still gets
#   retries + cooldown.  Matches hermes_cli/vertex_ai_locations.py.
# ─────────────────────────────────────────────────────────────────────────────

model_list:
  # ── Gemini 3.5 Flash: multi-region pool (quota = sum of all regions) ──
  - model_name: gemini-3.5-flash
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: __VERTEX_PROJECT__
      vertex_location: global
      rpm: 2000
  - model_name: gemini-3.5-flash
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: __VERTEX_PROJECT__
      vertex_location: asia-southeast1
      rpm: 2000
  - model_name: gemini-3.5-flash
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: __VERTEX_PROJECT__
      vertex_location: asia-northeast1
      rpm: 2000
  - model_name: gemini-3.5-flash
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: __VERTEX_PROJECT__
      vertex_location: asia-south1
      rpm: 2000
  - model_name: gemini-3.5-flash
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: __VERTEX_PROJECT__
      vertex_location: europe-west2
      rpm: 2000

  # ── Gemini 3.1 Pro Preview: global only ──
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_project: __VERTEX_PROJECT__
      vertex_location: global

  - model_name: gemini-3.1-pro
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_project: __VERTEX_PROJECT__
      vertex_location: global

  # ── Claude Sonnet 4.6: global only ──
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: vertex_ai/claude-sonnet-4-6
      vertex_project: __VERTEX_PROJECT__
      vertex_location: global

  # ── Claude Opus 4.8: global only ──
  - model_name: claude-opus-4-8
    litellm_params:
      model: vertex_ai/claude-opus-4-8
      vertex_project: __VERTEX_PROJECT__
      vertex_location: global

  # ── Claude Sonnet 5 (2026-06-24): global primary + US/EU spread ──
  - model_name: claude-sonnet-5
    litellm_params:
      model: vertex_ai/claude-sonnet-5
      vertex_project: __VERTEX_PROJECT__
      vertex_location: global
  - model_name: claude-sonnet-5
    litellm_params:
      model: vertex_ai/claude-sonnet-5
      vertex_project: __VERTEX_PROJECT__
      vertex_location: us-east5
  - model_name: claude-sonnet-5
    litellm_params:
      model: vertex_ai/claude-sonnet-5
      vertex_project: __VERTEX_PROJECT__
      vertex_location: europe-west1

  # ── Claude Fable 5 (2026-06-09): global only. REQUIRES Anthropic publisher
  #    data-sharing enabled on the project (Console → Model Garden → Claude
  #    Fable 5 → enable data sharing) or predict returns 403 PERMISSION_DENIED. ──
  - model_name: claude-fable-5
    litellm_params:
      model: vertex_ai/claude-fable-5
      vertex_project: __VERTEX_PROJECT__
      vertex_location: global

# Router: spread load across deployments, retry on 429, park exhausted regions.
router_settings:
  routing_strategy: least-busy      # send to the least-loaded healthy region
  num_retries: 4                    # retry a failed call (on another region for gemini)
  retry_after: 2                    # base seconds before retry
  allowed_fails: 2                  # 429s before a deployment is cooled down
  cooldown_time: 30                 # seconds a 429'd region sits out before retry
  retry_policy:
    RateLimitErrorRetries: 4        # explicit: keep retrying 429s
    TimeoutErrorRetries: 2
    InternalServerErrorRetries: 2
  # CRITICAL for streaming (Copilot streams every request): a 429 that happens
  # MID-STREAM is recovered ONLY via the fallbacks list — num_retries and
  # load-balancing alone do NOT cover the streaming path. Without this you get
  # 'litellm.MidStreamFallbackError ... Available Model Group Fallbacks=None'
  # even with a healthy multi-region model_list. Falling a model group back to
  # ITSELF makes the router re-pick another healthy region from the pool and
  # replay the request there. Verified: 120 parallel streaming calls → 0 client
  # 429s under real upstream quota pressure.
  # gemini-3.1-pro-preview is GLOBAL-ONLY on Vertex (all other regions 404 —
  # verified by live probe Jul 2026), so it CANNOT self-recover across regions
  # like the multi-region Flash pool. A mid-stream 429 on its single global
  # endpoint falling back to itself hits the just-cooled-down deployment →
  # "No deployments available" → Copilot renders the dead stream as a broken
  # tool call. Chain its fallback to the multi-region gemini-3.5-flash pool so a
  # 429 recovers onto a healthy region instead of dying. (Flash's tool-calling
  # is schema-compatible — verified against Copilot's real 86-tool manifest.)
  fallbacks:
    - gemini-3.5-flash: ["gemini-3.5-flash"]
    - gemini-3.1-pro-preview: ["gemini-3.1-pro-preview", "gemini-3.5-flash"]
    - gemini-3.1-pro: ["gemini-3.1-pro", "gemini-3.5-flash"]
    - claude-sonnet-4-6: ["claude-sonnet-4-6"]
    - claude-opus-4-8: ["claude-opus-4-8"]
    - claude-sonnet-5: ["claude-sonnet-5"]
    - claude-fable-5: ["claude-fable-5"]
  default_fallbacks: ["gemini-3.5-flash"]

litellm_settings:
  drop_params: true                 # tolerate Copilot params Vertex doesn't know
  set_verbose: false
  num_retries: 4                    # belt-and-suspenders top-level retry
  request_timeout: 600              # long Copilot agent turns / big contexts
  vertex_ai_safety_settings:
    - category: HARM_CATEGORY_HATE_SPEECH
      threshold: BLOCK_NONE
    - category: HARM_CATEGORY_HARASSMENT
      threshold: BLOCK_NONE
    - category: HARM_CATEGORY_SEXUALLY_EXPLICIT
      threshold: BLOCK_NONE
    - category: HARM_CATEGORY_DANGEROUS_CONTENT
      threshold: BLOCK_NONE

# master_key supplied via LITELLM_MASTER_KEY env at launch (DB-less). Proxy binds
# 127.0.0.1 only; the :8644 auth shim sits in front for clean 401s.
general_settings: {}
